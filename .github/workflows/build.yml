name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/adontoo/device_meizu_m2481-TWRP"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-16"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "meizu/m2481"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "m2481"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      RELEASE_NAME:
        description: "Release name(replace xxx with TWRP-3.7.1-16-xxx)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LUNCH_TARGET: ${{ github.event.inputs.LUNCH_TARGET != '' && github.event.inputs.LUNCH_TARGET || github.event.inputs.DEVICE_NAME }}
      RELEASE_NAME: ${{ github.event.inputs.RELEASE_NAME != '' && github.event.inputs.RELEASE_NAME || github.event.inputs.DEVICE_NAME }}
      BUILD_PARTITION: ${{ github.event.inputs.BUILD_PARTITION }}
      DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
      DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      BUILD_DATE: ${{ github.run_id }}-${{ github.run_number }}

    steps:
    - name: Show build info
      run: |
        echo "Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}"
        echo "Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}"
        echo "Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device path: $DEVICE_PATH"
        echo "Device name: $DEVICE_NAME"
        echo "Lunch target: $LUNCH_TARGET"
        echo "Build target: $BUILD_PARTITION.img"
        echo "Build date: $(date)"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup build environment
      run: |
      	export DEBIAN_FRONTEND=noninteractive
        sudo apt update
        sudo apt upgrade -y
        sudo apt install -y repo zram-tools git
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -j$(nproc --all) || repo sync -j1
        kill $TIP_PID || true

    - name: Setup device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/$DEVICE_PATH

    - name: Generate build info
      run: |
        {
          echo "Build Info"
          echo "=========="
          echo "Date: $(date)"
          echo "Device: $DEVICE_NAME"
          echo "Manifest: ${{ github.event.inputs.TWRP_MANIFEST_URL }} (${{ github.event.inputs.TWRP_MANIFEST_BRANCH }})"
          echo "Device tree: ${{ github.event.inputs.DEVICE_TREE_URL }} (${{ github.event.inputs.DEVICE_TREE_BRANCH }})"
          echo ""
          echo "Change log:"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s"
          else
            git log --pretty=format:"- %h-%an: %s"
          fi
        } > INFO.txt
        cat INFO.txt
      working-directory: device/$DEVICE_PATH

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export USE_CCACHE=1
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        lunch twrp_$LUNCH_TARGET
        trap 'kill $TIP_PID || true' EXIT
        (while true; do echo "$(date +%T) Building TWRP..."; free -h; sleep 30; done) &
        TIP_PID=$!
        m ${BUILD_PARTITION}image
        mv out/target/product/$DEVICE_NAME/${BUILD_PARTITION}.img out/target/product/$DEVICE_NAME/TWRP-3.7.1-16-${RELEASE_NAME}-${BUILD_DATE}.img

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/target/product/${{ env.DEVICE_NAME }}/TWRP-3.7.1-16-${{ env.RELEASE_NAME }}-${{ env.BUILD_DATE }}.img
        name: TWRP-3.7.1-16-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
        tag_name: ${{ env.BUILD_DATE }}
        body_path: device/${{ env.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
